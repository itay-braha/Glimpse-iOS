name: TestFlight

# Manual only: archives a Release build, signs it in the cloud with the App Store
# Connect API key, and uploads it to TestFlight. One run = one build.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin role, .p8 contents)
#   APPLE_TEAM_ID                           10-character team ID
#   SUPABASE_PROJECT_HOST                   e.g. abcd1234.supabase.co (no https://)
#   SUPABASE_PUBLISHABLE_KEY                the public (publishable) key
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What to test in this build (shown to testers)
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUPABASE_PROJECT_HOST: ${{ secrets.SUPABASE_PROJECT_HOST }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID SUPABASE_PROJECT_HOST SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - name: Write config and key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SUPABASE_PROJECT_HOST: ${{ secrets.SUPABASE_PROJECT_HOST }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'SUPABASE_PROJECT_HOST = %s\nSUPABASE_PUBLISHABLE_KEY = %s\n' \
            "$SUPABASE_PROJECT_HOST" "$SUPABASE_PUBLISHABLE_KEY" > ios/Config/Secrets.xcconfig
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Every upload needs a new build number: the run number keeps rising.
          BUILD=$((100 + ${{ github.run_number }}))
          echo "Build number $BUILD"
          xcodebuild archive \
            -project ios/Glimpse.xcodeproj \
            -scheme Glimpse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Glimpse.xcarchive" \
            -clonedSourcePackagesDirPath ios/.spm \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD" \
            > archive.log 2>&1 || { grep -E "error:|warning: .*(sign|provision)" -A3 archive.log | head -120; exit 1; }
          grep -E "\*\* ARCHIVE" archive.log

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Glimpse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { grep -E "error|Error" -A3 export.log | head -120; exit 1; }
          tail -5 export.log
          echo "Uploaded. It shows up in App Store Connect > TestFlight after Apple finishes processing (5-30 min)."

      - name: Tester notes
        if: inputs.notes != ''
        env:
          NOTES: ${{ inputs.notes }}
        run: echo "Paste into TestFlight > build > What to Test:" && printf '%s\n' "$NOTES"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ios/Config/Secrets.xcconfig

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-logs-${{ github.run_number }}
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
